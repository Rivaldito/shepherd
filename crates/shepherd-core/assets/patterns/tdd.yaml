name: tdd
kind: blackboard
description: |-
  Multi-agent TDD. Starts: test-writer (posts `tests:` to `board`, written from the spec alone, so it never tailors them to an implementation). The coder implements until they pass; the runner runs the real test command and posts the exact failures back. Capped at 4 rounds, then it stops for a human.

  Use it when you have a clear spec and want tests that do not mirror the implementation: the test writer never sees the code. Not when the spec is still vague.

  Example: shepherd pattern run tdd --task "Implement slugify(title) as described in docs/slugify.md: lowercase, hyphens, no accents"
topics:
  - name: board
    partitions: 1
    max_messages: 16
agents:
  - id: test-writer
    role: tester
    count: 1
    start: true
    prompt: "You are the test writer. Work only from the run objective and the specification: do not read the coder's branch or worktree, and do not look at any implementation of the feature. Write the failing unit tests first (basic cases, edge cases, error cases), commit them in your worktree and post 'tests: <branch and the command that runs them>' on the board. If a 'failures:' message shows a test that is wrong or ambiguous with respect to the spec, fix the test and post 'tests:' again; never weaken a test just to make it pass."
    publishes:
      - board
    consumes:
      - board
  - id: coder
    role: coder
    count: 1
    prompt: "You are the coder. When 'tests:' arrives, check out those tests, implement the feature until they pass and post 'code: round N/4' with your branch. When 'failures:' arrives, fix the code (not the tests) and post the next round. Never edit the test files. After round 4 with tests still failing, post 'blocked: ' with what you could not solve and stop."
    publishes:
      - board
    consumes:
      - board
  - id: runner
    role: tester
    count: 1
    prompt: "You are the runner. When 'code:' arrives, check out the coder's branch with the tests and call the run_checks tool with the coder's agent id: it runs the project's real checks and returns PASSED or FAILED, the exit code and the real output of each command. Post 'failures: round N/4' with that report copied as is, never paraphrased or summarised (add only the round). If it says PASSED, post 'passed: round N/4' and the summary line. If run_checks reports that there are no checks to run, say so and stop: do not invent a command. Do not edit any file."
    publishes:
      - board
    consumes:
      - board
